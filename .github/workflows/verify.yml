name: Verify
on: [push, pull_request]
env:
  GENVM_VERSION: v0.2.16
  PYTHONUTF8: '1'
  FORKPOINT_STUDIONET_CONTRACT: '0x2702C583b4d331f299B2f5988A9DeB476610f221'
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --locked
      - run: uv run python scripts/build_contract.py
      - run: uv run genvm-lint check build/forkpoint.py
      - run: node scripts/verify-studionet.mjs ${{ env.FORKPOINT_STUDIONET_CONTRACT }}
      - run: uv run python -m pytest --cov=build --cov-branch --cov-report=term-missing --cov-report=xml
      - run: uv run python scripts/mutate_contract.py
      - run: npm ci
      - run: npm run genlayer -- --version
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npx playwright install chromium
        if: runner.os == 'Windows'
      - run: npx playwright test
      - run: node scripts/mutate_frontend.mjs


